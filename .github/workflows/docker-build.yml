name: Docker build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          tags: s13-docker-pipeline:latest
          load: true
          push: false
      - name: Show built Docker image
        run: docker image ls --no-trunc s13-docker-pipeline:latest
