name: Docker build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: dockerhub-tokens13/devopseasylearning:latest
          push: true
      - name: Build Docker image for pull request
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: s13-docker-pipeline:pr
          load: true
          push: false
      - name: Show published Docker image
        if: github.event_name == 'push'
        env:
          IMAGE: dockerhub-tokens13/devopseasylearning:latest
        run: |
          docker pull "$IMAGE"
          docker image ls --no-trunc "$IMAGE"
      - name: Start and inspect published container
        if: github.event_name == 'push'
        env:
          IMAGE: dockerhub-tokens13/devopseasylearning:latest
        run: |
          docker run --detach --name devopseasylearning-container "$IMAGE"
          docker inspect --format='Name={{.Name}} Image={{.Config.Image}} Status={{.State.Status}}' devopseasylearning-container
          docker logs --tail 100 devopseasylearning-container
      - name: Show pull request Docker image
        if: github.event_name == 'pull_request'
        run: docker image ls --no-trunc s13-docker-pipeline:pr
